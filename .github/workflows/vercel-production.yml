name: Deploy Produção (Vercel)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verificar secrets da Vercel
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Secret ausente: VERCEL_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "Secrets ausentes: VERCEL_ORG_ID e/ou VERCEL_PROJECT_ID"
            echo "Adicione em GitHub: Settings → Secrets and variables → Actions"
            exit 1
          fi
      - run: npm ci
      - run: |
          SCOPE_ARG=""
          if [ -n "${{ secrets.VERCEL_SCOPE }}" ]; then
            SCOPE_ARG="--scope=${{ secrets.VERCEL_SCOPE }}"
          fi
          echo "Versão do Vercel CLI:"
          npx vercel --version
          echo "Scope: ${SCOPE_ARG:-<nenhum>}"
          echo "Checando variáveis obrigatórias na Vercel (Produção):"
          ENVS="$(npx vercel env ls production --token=${{ secrets.VERCEL_TOKEN }} $SCOPE_ARG || true)"
          echo "${ENVS}"
          echo "${ENVS}" | grep -Eq "VITE_SUPABASE_URL|VITE_PUBLIC_SUPABASE_URL" || { echo "Variável ausente na Vercel: VITE_SUPABASE_URL (Produção)"; exit 1; }
          echo "${ENVS}" | grep -Eq "VITE_SUPABASE_ANON_KEY|VITE_PUBLIC_SUPABASE_ANON_KEY|VITE_SUPABASE_KEY|VITE_PUBLIC_SUPABASE_KEY" || { echo "Variável ausente na Vercel: VITE_SUPABASE_ANON_KEY (Produção)"; exit 1; }
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} $SCOPE_ARG
          if [ -f .vercel/project.json ]; then
            echo ".vercel/project.json:"
            cat .vercel/project.json
          else
            echo "Aviso: .vercel/project.json não encontrado após vercel pull"
          fi
          npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} $SCOPE_ARG
          DEPLOY_URL="$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} $SCOPE_ARG | tail -n 1)"
          echo "Deploy concluído: ${DEPLOY_URL}"
          DOMAIN="${{ secrets.VERCEL_PRODUCTION_DOMAIN }}"
          if [ -z "${DOMAIN}" ]; then
            DOMAIN="app.connektco.com"
          fi
          if [ -n "${DOMAIN}" ]; then
            npx vercel alias set "${DEPLOY_URL}" "${DOMAIN}" --token=${{ secrets.VERCEL_TOKEN }} $SCOPE_ARG || echo "Aviso: falha ao criar alias para ${DOMAIN}. Verifique propriedade/validação do domínio ou defina VERCEL_PRODUCTION_DOMAIN."
          fi
