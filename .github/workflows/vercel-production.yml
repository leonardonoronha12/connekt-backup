name: Vercel Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check Vercel secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Missing secret: VERCEL_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "Missing secrets: VERCEL_ORG_ID and/or VERCEL_PROJECT_ID"
            echo "Add them in GitHub: Settings → Secrets and variables → Actions"
            exit 1
          fi
      - run: npm ci
      - run: |
          SCOPE_ARG=""
          if [ -n "${{ secrets.VERCEL_SCOPE }}" ]; then
            SCOPE_ARG="--scope=${{ secrets.VERCEL_SCOPE }}"
          fi
          echo "Vercel CLI version:"
          npx vercel --version
          echo "Using scope arg: ${SCOPE_ARG:-<none>}"
          echo "Checking required Vercel env vars (Production):"
          ENVS="$(npx vercel env ls production --token=${{ secrets.VERCEL_TOKEN }} $SCOPE_ARG || true)"
          echo "${ENVS}"
          echo "${ENVS}" | grep -Eq "VITE_SUPABASE_URL|VITE_PUBLIC_SUPABASE_URL" || { echo "Missing Vercel env: VITE_SUPABASE_URL (Production)"; exit 1; }
          echo "${ENVS}" | grep -Eq "VITE_SUPABASE_ANON_KEY|VITE_PUBLIC_SUPABASE_ANON_KEY|VITE_SUPABASE_KEY|VITE_PUBLIC_SUPABASE_KEY" || { echo "Missing Vercel env: VITE_SUPABASE_ANON_KEY (Production)"; exit 1; }
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} $SCOPE_ARG
          if [ -f .vercel/project.json ]; then
            echo ".vercel/project.json:"
            cat .vercel/project.json
          else
            echo "Warning: .vercel/project.json not found after vercel pull"
          fi
          npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} $SCOPE_ARG
          DEPLOY_URL="$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} $SCOPE_ARG | tail -n 1)"
          echo "Deployed: ${DEPLOY_URL}"
          DOMAIN="${{ secrets.VERCEL_PRODUCTION_DOMAIN }}"
          if [ -z "${DOMAIN}" ]; then
            DOMAIN="app.connektco.com"
          fi
          if [ -n "${DOMAIN}" ]; then
            npx vercel alias set "${DEPLOY_URL}" "${DOMAIN}" --token=${{ secrets.VERCEL_TOKEN }} $SCOPE_ARG || echo "Warning: vercel alias failed for domain ${DOMAIN}. Check domain ownership/verification or set VERCEL_PRODUCTION_DOMAIN."
          fi
