<svg width="500" height="960" viewBox="0 0 500 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="960" fill="url(#blueGradient)"/>
  
  <!-- Large circular shapes -->
  <circle cx="150" cy="200" r="120" fill="#1e40af" opacity="0.3"/>
  <circle cx="350" cy="400" r="80" fill="#2563eb" opacity="0.4"/>
  <circle cx="100" cy="600" r="100" fill="#1d4ed8" opacity="0.2"/>
  
  <!-- Oval shapes -->
  <ellipse cx="400" cy="150" rx="60" ry="100" fill="#3730a3" opacity="0.3"/>
  <ellipse cx="50" cy="350" rx="80" ry="50" fill="#1e40af" opacity="0.4"/>
  <ellipse cx="300" cy="700" rx="90" ry="60" fill="#2563eb" opacity="0.3"/>
  
  <!-- Abstract curved shapes -->
  <path d="M200 100 Q300 150 250 250 Q200 300 150 250 Q100 200 200 100" fill="#1e3a8a" opacity="0.4"/>
  <path d="M350 500 Q450 550 400 650 Q350 700 300 650 Q250 600 350 500" fill="#3b82f6" opacity="0.3"/>
  <path d="M100 800 Q200 850 150 950 Q100 1000 50 950 Q0 900 100 800" fill="#1d4ed8" opacity="0.4"/>
  
  <!-- Additional geometric elements -->
  <polygon points="400,300 450,350 400,400 350,350" fill="#2563eb" opacity="0.3"/>
  <polygon points="80,450 130,500 80,550 30,500" fill="#1e40af" opacity="0.4"/>
</svg>