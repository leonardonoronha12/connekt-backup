<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F4FF" />
      <stop offset="50%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#FFE4F3" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="88" height="88" rx="16" fill="url(#bgGrad)" />

  <!-- Decorative dots -->
  <g opacity="0.25">
    <circle cx="20" cy="20" r="2" fill="#6366F1" />
    <circle cx="36" cy="28" r="2" fill="#6366F1" />
    <circle cx="52" cy="18" r="2" fill="#6366F1" />
    <circle cx="70" cy="26" r="2" fill="#6366F1" />
    <circle cx="26" cy="44" r="2" fill="#6366F1" />
    <circle cx="44" cy="54" r="2" fill="#6366F1" />
    <circle cx="64" cy="48" r="2" fill="#6366F1" />
    <circle cx="76" cy="64" r="2" fill="#6366F1" />
    <circle cx="28" cy="72" r="2" fill="#6366F1" />
    <circle cx="48" cy="78" r="2" fill="#6366F1" />
  </g>

  <!-- Clipboard icon for "simulado" theme -->
  <g filter="url(#softShadow)" transform="translate(24,22)">
    <!-- Clip board -->
    <rect x="0" y="12" width="48" height="48" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" />
    <!-- Top holder -->
    <rect x="12" y="0" width="24" height="16" rx="4" fill="url(#accentGrad)" />
    <rect x="20" y="4" width="8" height="8" rx="2" fill="#FFFFFF" opacity="0.9" />
    <!-- Lines -->
    <rect x="10" y="24" width="28" height="3" rx="1.5" fill="#E5E7EB" />
    <rect x="10" y="32" width="28" height="3" rx="1.5" fill="#E5E7EB" />
    <rect x="10" y="40" width="18" height="3" rx="1.5" fill="#E5E7EB" />
    <!-- Check mark -->
    <path d="M34 44 l4 4 l8 -10" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Accent blobs -->
  <circle cx="80" cy="20" r="9" fill="#C084FC" opacity="0.25" />
  <circle cx="18" cy="76" r="11" fill="#60A5FA" opacity="0.25" />
</svg>