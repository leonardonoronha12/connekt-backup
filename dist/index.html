		<script type="module">
window.onerror = (message, source, lineno, colno, errorObj) => {
	const errorDetails = errorObj ? JSON.stringify({
		name: errorObj.name,
		message: errorObj.message,
		stack: errorObj.stack,
		source,
		lineno,
		colno,
	}) : null;

	window.parent.postMessage({
		type: 'horizons-runtime-error',
		message,
		error: errorDetails
	}, '*');

	try {
		const msg = String(message || '');
		if (msg.includes('net::ERR_ABORTED') || msg.includes('ERR_ABORTED')) {
			return true;
		}
	} catch {}
};

window.onunhandledrejection = (event) => {
	try {
		const r = event && event.reason;
		const msg = String(r && (r.message || r) || '');
		if (msg.includes('Failed to fetch') || msg.includes('net::ERR_ABORTED') || msg.includes('ERR_ABORTED')) {
			try { event.preventDefault(); } catch {}
			return;
		}
		window.parent.postMessage({
			type: 'horizons-runtime-error',
			message: 'unhandledrejection',
			error: JSON.stringify({ message: msg, stack: r && r.stack })
		}, '*');
	} catch {}
};

window.addEventListener('error', (event) => {
	try {
		const t = event && event.target;
		const src = t && (t.src || t.href) ? String(t.src || t.href) : '';
		if (src && (src.startsWith('blob:') || /\.(svg|png|jpe?g|webp)(\?|#|$)/i.test(src))) {
			try { event.preventDefault(); } catch {}
			try { event.stopImmediatePropagation(); } catch {}
		}
	} catch {}
}, true);
</script>
		<script type="module">
const observer = new MutationObserver((mutations) => {
	for (const mutation of mutations) {
		for (const addedNode of mutation.addedNodes) {
			if (
				addedNode.nodeType === Node.ELEMENT_NODE &&
				(
					addedNode.tagName?.toLowerCase() === 'vite-error-overlay' ||
					addedNode.classList?.contains('backdrop')
				)
			) {
				handleViteOverlay(addedNode);
			}
		}
	}
});

observer.observe(document.documentElement, {
	childList: true,
	subtree: true
});

function handleViteOverlay(node) {
	if (!node.shadowRoot) {
		return;
	}

	const backdrop = node.shadowRoot.querySelector('.backdrop');

	if (backdrop) {
		const overlayHtml = backdrop.outerHTML;
		const parser = new DOMParser();
		const doc = parser.parseFromString(overlayHtml, 'text/html');
		const messageBodyElement = doc.querySelector('.message-body');
		const fileElement = doc.querySelector('.file');
		const messageText = messageBodyElement ? messageBodyElement.textContent.trim() : '';
		const fileText = fileElement ? fileElement.textContent.trim() : '';
		const error = messageText + (fileText ? ' File:' + fileText : '');

		window.parent.postMessage({
			type: 'horizons-vite-error',
			error,
		}, '*');
	}
}
</script>
		<script type="module">
const originalConsoleError = console.error;
console.error = function(...args) {
	try {
		const msg = args.map(arg => {
			try {
				if (arg instanceof Error) return String(arg.message || arg.stack || arg);
				return typeof arg === 'string' ? arg : JSON.stringify(arg);
			} catch {
				return String(arg);
			}
		}).join(' ');
		if (msg.includes('net::ERR_ABORTED') || msg.includes('ERR_ABORTED')) {
			return;
		}
	} catch {}

	originalConsoleError.apply(console, args);

	let errorString = '';

	for (let i = 0; i < args.length; i++) {
		const arg = args[i];
		if (arg instanceof Error) {
			errorString = arg.stack || `${arg.name}: ${arg.message}`;
			break;
		}
	}

	if (!errorString) {
		errorString = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(' ');
	}

	window.parent.postMessage({
		type: 'horizons-console-error',
		error: errorString
	}, '*');
};
</script>
		<script type="module">
if (window.navigation && window.self !== window.top) {
	window.navigation.addEventListener('navigate', (event) => {
		const url = event.destination.url;

		try {
			const destinationUrl = new URL(url);
			const destinationOrigin = destinationUrl.origin;
			const currentOrigin = window.location.origin;

			if (destinationOrigin === currentOrigin) {
				return;
			}
		} catch (error) {
			return;
		}

		window.parent.postMessage({
			type: 'horizons-navigation-error',
			url,
		}, '*');
	});
}
</script>
